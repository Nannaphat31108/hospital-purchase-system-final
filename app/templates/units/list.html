{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1 class="h3">ข้อมูลหน่วย</h1><p class="text-muted">หน่วยนับของเวชภัณฑ์</p></div><a class="btn btn-primary" href="{{ url_for('main.unit_form') }}">+ เพิ่มหน่วย</a></div><form class="row g-2 mb-3"><div class="col-md-5"><input class="form-control" name="q" value="{{ q }}" placeholder="ค้นหาหน่วย"></div><div class="col-auto"><button class="btn btn-outline-primary">ค้นหา</button></div></form><div class="card"><table class="table table-hover align-middle mb-0"><thead><tr><th>ชื่อหน่วย</th><th>สถานะ</th><th class="text-end">จัดการ</th></tr></thead><tbody>{% for u in units %}<tr><td>{{ u.name }}</td><td><span class="badge bg-{{ 'success' if u.active else 'secondary' }}">{{ 'ใช้งาน' if u.active else 'ปิดใช้งาน' }}</span></td><td class="text-end"><a class="btn btn-sm btn-outline-warning" href="{{ url_for('main.unit_form',unit_id=u.id) }}">แก้ไข</a><form class="d-inline" method="post" action="{{ url_for('main.unit_toggle',unit_id=u.id) }}"><button class="btn btn-sm btn-outline-{{ 'danger' if u.active else 'success' }}">{{ 'ปิดใช้งาน' if u.active else 'เปิดใช้งาน' }}</button></form></td></tr>{% else %}<tr><td colspan="3" class="text-center py-4">ไม่พบข้อมูล</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
