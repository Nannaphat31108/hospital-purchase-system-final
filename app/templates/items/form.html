{% extends 'base.html' %}{% block content %}<h1 class="h3 mb-4">{{ 'แก้ไข' if item.id else 'เพิ่ม' }}ข้อมูลเวชภัณฑ์</h1><form method="post" class="card"><div class="card-body"><div class="row g-3"><div class="col-md-4"><label class="form-label">รหัส</label><input class="form-control" name="code" value="{{ item.code or '' }}"></div><div class="col-md-8"><label class="form-label">ชื่อรายการ *</label><input class="form-control" name="name" required value="{{ item.name or '' }}"></div><div class="col-md-6"><label class="form-label">หน่วย *</label><select class="form-select" name="unit_id" required><option value="">-- เลือก --</option>{% for u in units %}<option value="{{ u.id }}" {% if item.unit_id==u.id %}selected{% endif %}>{{ u.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">ราคาตั้งต้น</label><input type="number" min="0" step="0.01" class="form-control" name="default_price" value="{{ item.default_price or 0 }}"></div><div class="col-12"><label class="form-label">รายละเอียดคุณลักษณะเฉพาะ (Spec)</label><textarea class="form-control" name="specification" rows="6">{{ item.specification or '' }}</textarea></div></div></div><div class="card-footer text-end"><a class="btn btn-light" href="{{ url_for('main.items') }}">ยกเลิก</a><button class="btn btn-primary">บันทึก</button></div></form>{% endblock %}
