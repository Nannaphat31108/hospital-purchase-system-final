<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ระบบจัดซื้อเวชภัณฑ์{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="{{ url_for('main.dashboard') }}">ระบบจัดซื้อเวชภัณฑ์</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.companies') }}">บริษัท</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.items') }}">เวชภัณฑ์</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.units') }}">หน่วย</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.purchases') }}">ใบสั่งซื้อ</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container-fluid px-4 py-4">
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}<button class="btn-close" data-bs-dismiss="alert"></button></div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
